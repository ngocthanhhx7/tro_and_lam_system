server {
    listen 80;
    listen [::]:80;
    server_name trovalam.vn www.trovalam.vn;
    root /opt/tro-lam/current/fondend/dist;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tro-lam/acme;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
