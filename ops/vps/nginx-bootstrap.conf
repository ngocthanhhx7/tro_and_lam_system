server {
    listen 80;
    listen [::]:80;
    server_name trovalam.vn www.trovalam.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tro-lam/acme;
        try_files $uri =404;
    }
    # Serve only ACME while certificates are being issued; never an HTTP login.
    location / { return 503; }
    location ~ /\. { deny all; }
}
