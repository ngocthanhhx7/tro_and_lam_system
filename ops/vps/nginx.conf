server {
    listen 80;
    listen [::]:80;
    server_name trovalam.vn www.trovalam.vn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/tro-lam/acme;
        try_files $uri =404;
    }
    location / { return 301 https://trovalam.vn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.trovalam.vn;
    ssl_certificate /etc/letsencrypt/live/trovalam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trovalam.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://trovalam.vn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name trovalam.vn;
    root /opt/tro-lam/current/fondend/dist;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/trovalam.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trovalam.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_intercept_errors on;
        error_page 502 504 =503 @api_unavailable;
    }
    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Retry-After 30 always;
        add_header X-Request-ID $request_id always;
        return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"Dịch vụ đang chờ cấu hình hoặc khởi động. Vui lòng thử lại sau.","details":[]},"meta":{"requestId":"$request_id"}}';
    }
    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
