name: quality

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: contracts, tests, build and browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start disposable MongoDB replica set
        run: |
          docker run -d --rm --name tro-lam-ci-mongo -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec tro-lam-ci-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -qx '1'; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1

      - name: Initialize single-node replica set
        run: |
          docker exec tro-lam-ci-mongo mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          primary=0
          for attempt in $(seq 1 60); do
            if docker exec tro-lam-ci-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -qx 'true'; then
              primary=1
              break
            fi
            sleep 1
          done
          test "$primary" -eq 1

      - name: Run contracts, lint, backend tests and production build
        env:
          P02_TEST_REPLICA_SET_URI: mongodb://127.0.0.1:27017/tro_lam_p02_ci_test
          P05_TEST_REPLICA_SET_URI: mongodb://127.0.0.1:27017/tro_lam_p05_ci_test
          P06_TEST_REPLICA_SET_URI: mongodb://127.0.0.1:27017/tro_lam_p06_ci_test
          P09_TEST_REPLICA_SET_URI: mongodb://127.0.0.1:27017/tro_lam_p09_ci_test
        run: npm run check

      - name: Set isolated browser-test database
        run: |
          suffix=$(printf '%012x' "$GITHUB_RUN_ID")
          echo "P11_E2E_MONGODB_URI=mongodb://127.0.0.1:27017/tro_lam_p11_e2e_test_${suffix}" >> "$GITHUB_ENV"

      - name: Run integrated browser acceptance
        run: npm run test:e2e

      - name: Remove disposable MongoDB container
        if: always()
        run: docker rm -f tro-lam-ci-mongo || true
