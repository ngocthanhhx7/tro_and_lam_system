name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main, develop, 'feature/**', 'hotfix/**']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
