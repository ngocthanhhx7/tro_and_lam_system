openapi: 3.1.0
info:
  title: TRO & LAM API
  version: 1.2.0
  description: |
    Contract frozen from doc/planning/04-data-model.md and 05-api-contracts.md.
    All application routes use /api/v1. Health probes keep the scaffold response
    shape. Provider webhook wire payload and ACK are delegated to the current
    provider documentation; browser redirects never mutate payment state.
servers:
  - url: /api/v1
tags:
  - name: health
  - name: catalog
  - name: auth
  - name: account
  - name: cart
  - name: checkout
  - name: orders
  - name: payments
  - name: support
  - name: assistant
  - name: attachments
  - name: staff
  - name: admin
paths:
  /health:
    get:
      operationId: getLegacyHealth
      tags: [health]
      responses:
        '200':
          description: Legacy liveness shape retained for the scaffold.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: ok } }, additionalProperties: false }
  /health/live:
    get:
      operationId: getHealthLive
      tags: [health]
      responses:
        '200':
          description: Liveness probe; database independent.
          content:
            application/json:
              schema: { type: object, required: [status], properties: { status: { const: ok } }, additionalProperties: false }
  /health/ready:
    get:
      operationId: getHealthReady
      tags: [health]
      responses:
        '200':
          description: Database readiness probe.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthReady' }
        '503':
          description: Database not ready; health response remains outside the normal envelope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthUnavailable' }
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: line, schema: { $ref: '#/components/schemas/ProductLine' } }
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: priceMin, schema: { type: integer, minimum: 0 } }
        - { in: query, name: priceMax, schema: { type: integer, minimum: 0 } }
        - { in: query, name: saleMode, schema: { $ref: '#/components/schemas/SaleMode' } }
        - { in: query, name: available, description: Filter buyable products by inventory availability; false selects buyable products with no available stock., schema: { type: boolean } }
        - { in: query, name: sort, schema: { type: string, enum: [name, price_asc, price_desc, newest] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /products/{slug}:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      operationId: getProductBySlug
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: locale, schema: { type: string, enum: [vi, en] } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /categories:
    get:
      operationId: listPublishedCategories
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: locale, schema: { type: string, enum: [vi, en] } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /products/{id}/reviews:
    parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
    get:
      operationId: listPublishedProductReviews
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /pages/{slug}:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      operationId: getPublishedPage
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: locale, schema: { type: string, enum: [vi, en] } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /stories/{slug}:
    parameters: [{ $ref: '#/components/parameters/Slug' }]
    get:
      operationId: getPublishedStory
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: locale, schema: { type: string, enum: [vi, en] } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /nfc/{publicId}:
    parameters: [{ name: publicId, in: path, required: true, schema: { type: string } }]
    get:
      operationId: resolvePublicNfcTag
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: locale, schema: { type: string, enum: [vi, en] } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '410': { $ref: '#/components/responses/Error' } }
  /commerce/config:
    get:
      operationId: getPublicCommerceConfig
      tags: [catalog]
      x-actors: [guest, customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /contacts:
    post:
      operationId: createContact
      tags: [support]
      x-actors: [guest, customer]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactCreate' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [auth]
      x-actors: [guest, customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [auth]
      x-actors: [guest]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserRegister' }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '400': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/InvitationAccept' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '400': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '410': { $ref: '#/components/responses/Error' } }
  /auth/resend-verification:
    post:
      operationId: resendVerification
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } }, additionalProperties: false } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string, format: email }, password: { type: string } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      x-actors: [guest, customer, staff, admin]
      responses: { '204': { $ref: '#/components/responses/NoContent' }, default: { $ref: '#/components/responses/Error' } }
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } }, additionalProperties: false } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 12, maxLength: 128 } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '410': { $ref: '#/components/responses/Error' } }
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      x-actors: [customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /auth/appeal-challenges:
    post:
      operationId: createAppealChallenge
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email } }, additionalProperties: false } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '429': { $ref: '#/components/responses/Error' } }
  /auth/appeal-access:
    post:
      operationId: exchangeAppealAccess
      tags: [auth]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, verificationCode, challengeId], properties: { email: { type: string, format: email }, verificationCode: { type: string }, challengeId: { type: string } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' } }
  /account/appeals/current:
    get:
      operationId: getCurrentAppeal
      tags: [account]
      x-actors: [blocked-appeal]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /account/appeals:
    post:
      operationId: submitAppeal
      tags: [account]
      x-actors: [blocked-appeal]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [message], properties: { message: { type: string, minLength: 1, maxLength: 5000 } }, additionalProperties: false } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' } }
  /account/profile:
    patch:
      operationId: updateProfile
      tags: [account]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProfileWrite' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' }, '403': { $ref: '#/components/responses/Error' } }
  /account/addresses:
    get:
      operationId: listOwnAddresses
      tags: [account]
      x-actors: [customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createAddress
      tags: [account]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressWrite' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /account/addresses/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: updateOwnAddress
      tags: [account]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressPatch' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: deleteOwnAddress
      tags: [account]
      x-actors: [customer, staff, admin]
      parameters: [{ in: query, name: expectedVersion, required: true, schema: { type: integer, minimum: 0 } }]
      responses: { '204': { $ref: '#/components/responses/NoContent' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /account/addresses/{id}/default:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: setOwnAddressDefault
      tags: [account]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [expectedVersion], properties: { expectedVersion: { type: integer, minimum: 0 } }, additionalProperties: false } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /locations/reverse:
    post:
      operationId: reverseGeocode
      tags: [account]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/LocationReverse' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '503': { $ref: '#/components/responses/Error' } }
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      x-actors: [guest, customer, staff, admin]
      responses: { '200': { $ref: '#/components/responses/Success' }, default: { $ref: '#/components/responses/Error' } }
  /cart/items/{productId}:
    parameters: [{ name: productId, in: path, required: true, schema: { type: string } }]
    put:
      operationId: setCartItemQuantity
      tags: [cart]
      x-actors: [guest, customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartItemWrite' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
    delete:
      operationId: removeCartItem
      tags: [cart]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ in: query, name: expectedVersion, required: true, schema: { type: integer, minimum: 0 } }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /cart/merge:
    post:
      operationId: mergeGuestCart
      tags: [cart]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CartMerge' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' } }
  /checkout/quote:
    post:
      operationId: quoteCheckout
      tags: [checkout]
      x-actors: [guest, customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutQuote' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /orders:
    post:
      operationId: createOrder
      tags: [checkout]
      x-actors: [guest, customer, staff, admin]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CheckoutCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '200': { $ref: '#/components/responses/Success' }, '409': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /order-access/challenges:
    post:
      operationId: createGuestOrderAccessChallenge
      tags: [orders]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderAccessChallenge' } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '429': { $ref: '#/components/responses/Error' } }
  /order-access/verify:
    post:
      operationId: verifyGuestOrderAccess
      tags: [orders]
      x-actors: [guest]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderAccessVerify' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '403': { $ref: '#/components/responses/Error' }, '410': { $ref: '#/components/responses/Error' } }
  /orders/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getOwnedOrder
      tags: [orders]
      x-actors: [order-owner, guest-order-proof]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '401': { $ref: '#/components/responses/Error' } }
  /orders/{id}/cancel:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: cancelOwnedOrder
      tags: [orders]
      x-actors: [order-owner, guest-order-proof]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderCancel' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /orders/{id}/payment-attempts:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      operationId: createPaymentAttempt
      tags: [payments]
      x-actors: [order-owner, guest-order-proof]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
  /orders/{id}/payment:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getOwnedPaymentStatus
      tags: [payments]
      x-actors: [order-owner, guest-order-proof]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
  /payments/payos/webhook:
    post:
      operationId: receivePayosWebhook
      tags: [payments]
      x-actors: [payos-provider]
      description: Verify the current provider signature and transaction mapping before applying a payment fact. ACK shape follows provider documentation; never trust browser return parameters.
      requestBody: { required: true, content: { application/json: { schema: { type: object, description: Provider wire schema is pinned only after official PayOS documentation is verified. } } } }
      responses:
        '200': { description: Provider acknowledgement after durable event persistence; duplicate events are acknowledged idempotently. }
        '400': { description: Invalid signature or malformed provider request. }
        '401': { description: Provider authentication/signature failure. }
        '5XX': { description: Persistence unavailable; provider should retry. }
  /account/orders:
    get:
      operationId: listOwnOrders
      tags: [orders]
      x-actors: [customer, staff, admin]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/OrderStatus' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /account/orders/claim:
    post:
      operationId: claimGuestOrder
      tags: [orders]
      x-actors: [customer, staff, admin-with-guest-proof]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrderClaim' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /account/reviews:
    get:
      operationId: listOwnReviews
      tags: [support]
      x-actors: [customer, staff, admin]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/ReviewStatus' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
    post:
      operationId: createVerifiedReview
      tags: [support]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /account/reviews/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    patch:
      operationId: updateOwnReview
      tags: [support]
      x-actors: [customer, staff, admin]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReviewWrite' } } } }
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /account/tickets:
    get:
      operationId: listOwnTickets
      tags: [support]
      x-actors: [customer, staff, admin]
      parameters: [{ in: query, name: status, schema: { $ref: '#/components/schemas/TicketStatus' } }, { $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }]
      responses: { '200': { $ref: '#/components/responses/Success' }, '401': { $ref: '#/components/responses/Error' } }
  /tickets:
    post:
      operationId: createTicket
      tags: [support]
      x-actors: [customer, guest-order-proof]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TicketCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '401': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /orders/{id}/return-requests:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: listOwnedReturnRequests
      tags: [support]
      x-actors: [order-owner, guest-order-proof]
      responses: { '200': { $ref: '#/components/responses/Success' }, '404': { $ref: '#/components/responses/Error' } }
    post:
      operationId: requestReturn
      tags: [support]
      x-actors: [order-owner, guest-order-proof]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ReturnRequestCreate' } } } }
      responses: { '201': { $ref: '#/components/responses/Created' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' }, '422': { $ref: '#/components/responses/Error' } }
  /tickets/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      operationId: getOwnTicket
      tags: [support]
